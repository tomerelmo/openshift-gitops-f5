apiVersion: cis.f5.com/v1
kind: F5BigIpCtlr
metadata:
  name: my-f5-controller
  namespace: openshift-operators
spec:
  bigip_login_secret: f5-bigip-ctlr-login
  args:
    bigip_url: 10.1.30.201
    gtm-bigip-url: 10.1.30.201
    gtm-bigip-password: ilovesleep
    gtm-bigip-username: admin
    bigip_partition: openshift
    insecure: true
    pool-member-type: cluster
    static-routing-mode: true
    orchestration-cni: ovn-k8s
    custom-resource-mode: true
    log_level: ERROR
  image:
    pullPolicy: Always
    repo: f5networks/cntr-ingress-svcs
    user: registry.connect.redhat.com
  namespace: kube-system
  rbac:
    create: true
  serviceAccount:
    create: true
  version: latest

