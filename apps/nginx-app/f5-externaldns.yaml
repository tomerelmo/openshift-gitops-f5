apiVersion: cis.f5.com/v1
kind: ExternalDNS
metadata:
  name: nginx-wideip
  namespace: default
  labels:
    f5cr: "true"
spec:
  domainName: app.f5.train
  dnsRecordType: A
  loadBalanceMethod: round-robin
  pools:
  - name: app.f5.train
    dnsRecordType: A
    loadBalanceMethod: round-robin
    dataServerName: /Common/oc_pair
    monitor:
      type: http
      send: "GET /"
      recv: ""
      interval: 10
      timeout: 30

